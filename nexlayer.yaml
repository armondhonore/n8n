application:
  name: n8n
  pods:
  - name: app
    image: n8nio/n8n:latest
    path: /
    servicePorts:
    - 5678
    vars:
      N8N_HOST: "relaxed-weasel-n8n.cloud.nexlayer.ai"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "https"
      WEBHOOK_URL: "https://relaxed-weasel-n8n.cloud.nexlayer.ai"
      N8N_ENCRYPTION_KEY: "e5f6a7b8c9d0e5f6a7b8c9d0e5f6a7b8"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres.pod
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8npass
    volumes:
    - name: n8n-data
      mountPath: /home/node/.n8n
      size: 5Gi
  - name: postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8npass
    volumes:
    - name: n8n-postgres
      mountPath: /var/lib/postgresql/data
      size: 5Gi
